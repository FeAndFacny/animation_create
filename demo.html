<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>T-Anim Workbench MVP v0.3</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: #1e1e1e; color: #ddd; height: 100vh; display: flex; flex-direction: column; }
.main { flex: 1; display: flex; overflow: hidden; }
.sidebar { width: 320px; background: #252526; border-right: 1px solid #333; display: flex; flex-direction: column; }
.sidebar-section { padding: 12px; border-bottom: 1px solid #333; }
.sidebar h3 { font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #ccc; }
#codeInput {
  width: 100%; height: 180px; background: #1e1e1e; color: #d4d4d4; border: 1px solid #3c3c3c;
  padding: 8px; font-family: Consolas, monospace; font-size: 12px; resize: vertical;
}
#parseBtn {
  width: 100%; padding: 6px; margin-top: 8px; background: #0e639c; color: #fff;
  border: none; border-radius: 2px; cursor: pointer; font-size: 12px;
}
#parseBtn:hover { background: #1177bb; }
#paramPanel { flex: 1; overflow-y: auto; }
.param-item { margin-bottom: 10px; }
.param-label { font-size: 11px; color: #9cdcfe; margin-bottom: 4px; display: flex; justify-content: space-between; }
.param-label .value { color: #ce9178; font-family: Consolas, monospace; }
.param-slider { width: 100%; }
.warning { font-size: 10px; color: #f44747; margin-top: 4px; line-height: 1.2; }

.supplement-panel { margin-top: 12px; border-top: 1px solid #333; padding-top: 10px; }
.supplement-header {
  font-size: 12px; font-weight: 600; color: #aaa; margin-bottom: 8px; cursor: pointer;
  display: flex; justify-content: space-between; align-items: center; user-select: none;
}
.supplement-header:hover { color: #ccc; }
.supplement-tip { font-size: 10px; color: #666; font-weight: normal; }
.supplement-arrow { transition: transform 0.2s; font-size: 10px; }
.supplement-arrow.collapsed { transform: rotate(-90deg); }
.supplement-content { overflow: hidden; }
.supplement-content.collapsed { display: none; }
.bubble-param-item { margin-bottom: 10px; }
.bubble-param-label { font-size: 11px; color: #9cdcfe; margin-bottom: 4px; display: flex; justify-content: space-between; }
.bubble-param-label .value { color: #ce9178; font-family: Consolas, monospace; }
.bubble-param-slider { width: 100%; }
.bubble-param-checkbox { transform: scale(1.1); margin-left: 4px; }
.bubble-param-color {
  width: 100%; height: 22px; padding: 0; border: 1px solid #3c3c3c;
  background: #1e1e1e; cursor: pointer; display: block;
}
.panel-group-title {
  font-size: 11px; color: #888; margin: 8px 0 4px 0; font-weight: 500;
  border-bottom: 1px dashed #333; padding-bottom: 2px;
}

.canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #1a1a1a; }
#canvas { background: #f3f1ec; box-shadow: 0 0 20px rgba(0,0,0,0.3); cursor: default; }
#canvas.obj-hover { cursor: move; }
#canvas.obj-dragging { cursor: grabbing; }

.timeline {
  height: 60px; background: #252526; border-top: 1px solid #333;
  display: flex; align-items: center; padding: 0 16px; gap: 12px; position: relative;
}
#playBtn { padding: 4px 12px; background: #0e639c; color: #fff; border: none; border-radius: 2px; cursor: pointer; font-size: 12px; }
#exportBtn { padding: 4px 12px; background: #3a3d41; color: #ddd; border: 1px solid #555; border-radius: 2px; cursor: pointer; font-size: 12px; }
#exportBtn:hover { background: #4a4d51; }
.track-wrap { flex: 1; align-self: stretch; position: relative; display: flex; align-items: center; }
#timeSlider { width: 100%; position: relative; z-index: 1; }
#timeDisplay { font-family: Consolas, monospace; font-size: 12px; color: #ce9178; min-width: 50px; text-align: right; }
.time-marker-layer {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0;
  pointer-events: none; z-index: 2;
}
.time-marker {
  position: absolute; top: 10px; bottom: 10px; width: 2px; background: #ff9500;
  pointer-events: all; cursor: ew-resize; transform: translateX(-50%);
}
.time-marker-label {
  position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
  font-size: 10px; color: #ff9500; white-space: nowrap; background: #252526;
  padding: 1px 3px; border-radius: 2px;
}
.status { font-size: 11px; color: #6a9955; margin-top: 6px; }
.status.error { color: #f44747; }

.export-modal {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  align-items: center; justify-content: center; z-index: 100;
}
.export-modal.open { display: flex; }
.export-box {
  width: 760px; max-width: 92vw; background: #252526; border: 1px solid #3c3c3c;
  border-radius: 4px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
}
.export-title { font-size: 13px; color: #ccc; line-height: 1.5; }
.export-title .hint { font-size: 11px; color: #888; }
#exportOutput {
  width: 100%; height: 360px; background: #1e1e1e; color: #d4d4d4;
  border: 1px solid #3c3c3c; padding: 8px; font-family: Consolas, monospace;
  font-size: 12px; resize: vertical; white-space: pre;
}
.export-actions { display: flex; justify-content: flex-end; gap: 8px; }
.export-actions button {
  padding: 5px 14px; background: #0e639c; color: #fff; border: none;
  border-radius: 2px; cursor: pointer; font-size: 12px;
}
.export-actions button:hover { background: #1177bb; }
.export-actions button.secondary { background: #3a3d41; border: 1px solid #555; color: #ddd; }
.export-actions button.secondary:hover { background: #4a4d51; }
</style>
</head>
<body>
<div class="main">
  <div class="sidebar">
    <div class="sidebar-section">
      <h3>动画代码（符合 T-Anim v0.2 规范）</h3>
      <textarea id="codeInput"></textarea>
      <button id="parseBtn">解析参数并加载</button>
      <div id="status" class="status">等待输入代码</div>
    </div>
    <div class="sidebar-section" id="paramPanel">
      <h3>参数面板</h3>
      <div style="font-size:11px;color:#888;">解析代码后自动生成</div>
    </div>
  </div>
  <div class="canvas-wrap">
    <canvas id="canvas" width="800" height="500"></canvas>
  </div>
</div>
<div class="timeline">
  <button id="playBtn">播放</button>
  <button id="exportBtn">导出代码</button>
  <div class="track-wrap">
    <div id="timeMarkerLayer" class="time-marker-layer"></div>
    <input type="range" id="timeSlider" min="0" max="10" step="0.01" value="0">
  </div>
  <div style="text-align: right;">
    <div id="contentDuration" style="font-size: 10px; color: #888; margin-bottom: 2px;">内容时长: 3.00s</div>
    <div id="timeDisplay">0.00s</div>
  </div>
</div>
<div id="exportModal" class="export-modal">
  <div class="export-box">
    <div class="export-title">
      导出当前代码
      <span class="hint">—— 与原代码逻辑完全一致，只多了记录数值调整的 @adjust 行（画布拖拽 / 补充面板改动）</span>
    </div>
    <textarea id="exportOutput" readonly></textarea>
    <div class="export-actions">
      <button id="exportCopyBtn">复制</button>
      <button id="exportApplyBtn">应用到代码框</button>
      <button id="exportCloseBtn" class="secondary">关闭</button>
    </div>
  </div>
</div>
<script>
// =====================================================================
//  内置函数注册表 v0.3
//  每个内置函数只注册一次，注册时声明三件事：
//    1. 实现（util 用 fn / shape 用 draw）
//    2. 参数 schema（自动进「补充参数面板」，支持 number / int / enum / checkbox / color）
//    3. 交互句柄（在绘制过程中 push，自动进画布拖拽系统，无需任何 UI 代码改动）
//  工作台的「函数注入」「参数面板」「画布拖拽」三条链路全部由本表数据驱动。
// =====================================================================

const BuiltinRegistry = {
  _items: [],
  _handles: [],

  register(def) {
    if (this._items.some(it => it.name === def.name)) {
      throw new Error('内置函数重名：' + def.name);
    }
    const item = Object.assign({
      kind: 'shape',
      params: [],
      collapsed: false,
      _callIndex: 0,
      instances: []
    }, def);
    if (item.kind === 'shape') {
      item.instances.push(item.createState()); // 实例 0 供参数面板绑定
      item.fn = makeInjectedShape(item);
    }
    this._items.push(item);
    return item;
  },

  all() { return this._items; },
  shapes() { return this._items.filter(it => it.kind === 'shape'); },
  names() { return this._items.map(it => it.name); },
  fns() { return this._items.map(it => it.fn); },

  // ---- 每帧收集交互句柄（在 render 前调用） ----
  beginFrame() {
    this._handles.length = 0;
    this._items.forEach(it => { it._callIndex = 0; });
  },
  pushHandle(handle) { this._handles.push(handle); },
  // 倒序命中：后绘制的图形优先被拾取
  pickHandle(mx, my) {
    for (let i = this._handles.length - 1; i >= 0; i--) {
      const b = this._handles[i].bounds;
      if (b && mx >= b.left && mx <= b.right && my >= b.top && my <= b.bottom) {
        return this._handles[i];
      }
    }
    return null;
  },

  // ---- 解析代码时把实例状态复位为默认值，让「代码」成为唯一事实来源 ----
  resetStates() {
    this.shapes().forEach(item => {
      item.instances.length = 0;
      item.instances.push(item.createState());
    });
  },

  // ---- 应用代码里的 @adjust 行：设置第 idx 次调用的调整状态 ----
  setState(name, idx, patch) {
    const item = this.shapes().find(it => it.name === name);
    if (!item) return false;
    while (item.instances.length <= idx) item.instances.push(item.createState());
    Object.assign(item.instances[idx], patch);
    return true;
  }
};

// 把 shape 包装成 AI 代码里可直接调用的函数：
// AI 侧签名不变，内部按「本帧第几次调用」分配独立实例，避免多次绘制互相覆盖状态
function makeInjectedShape(item) {
  return function (...args) {
    const idx = item._callIndex++;
    if (!item.instances[idx]) item.instances[idx] = item.createState();
    return item.draw(item.instances[idx], ...args);
  };
}

// 坐标变换工具（仅内部使用，不注入给 AI）
function matrixTransformPoint(matrix, x, y) {
  return {
    x: matrix.a * x + matrix.c * y + matrix.e,
    y: matrix.b * x + matrix.d * y + matrix.f
  };
}

function registerUtil(name, fn) {
  BuiltinRegistry.register({ name, kind: 'util', fn });
}

// =====================================================================
//  注册项一：动画计算工具库（util，无可视参数、无交互句柄）
// =====================================================================

registerUtil('prog', function prog(t, start, end) {
  if (t < start) return 0;
  if (t > end) return 1;
  return (t - start) / (end - start);
});

registerUtil('fade', function fade(t, start, end, inDur, outDur) {
  if (t < start) return 0;
  if (t > end + outDur) return 0;
  if (t < start + inDur) return (t - start) / inDur;
  if (t > end) return (end + outDur - t) / outDur;
  return 1;
});

registerUtil('easeParabola', function easeParabola(x) {
  return 1 - (2 * x - 1) * (2 * x - 1);
});

registerUtil('delay', function delay(t, delayTime) {
  if (t < delayTime) return 0;
  return t - delayTime;
});

registerUtil('sequence', function sequence(t, stepIndex, stepDuration) {
  const startTime = stepIndex * stepDuration;
  const endTime = startTime + stepDuration;
  if (t < startTime) return 0;
  if (t > endTime) return 0;
  return (t - startTime) / stepDuration;
});

registerUtil('easeOutBack', function easeOutBack(x) {
  const c1 = 1.70158;
  const c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
});

registerUtil('easeInOut', function easeInOut(x) {
  return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
});

// =====================================================================
//  注册项二：drawBubble（shape，第一个迁移样板）
//  参数 schema 的 key 直接对应实例状态字段；句柄在 draw 内 push
// =====================================================================

BuiltinRegistry.register({
  name: 'drawBubble',
  kind: 'shape',
  label: '云朵气泡',

  createState() { return Object.assign({}, this.defaults); },
  defaults: {
    fillStyle: '#ffffff',
    strokeStyle: '#333333',
    lineWidth: 3,
    cloudWidth: 1.0,
    cloudHeight: 1.0,
    bumpHeight: 0.25,
    bumpCount: 7,
    tailType: 'cloud',
    tailSide: 'bottom',
    tailSize: 1.0,
    showDots: null,       // null = 跟随 tailType 自动
    showTail: true,
    tailAngle: 0,
    offsetX: 0,
    offsetY: 0
  },

  params: [
    { key: 'offsetX', group: '位置调整', label: '气泡水平位置', min: -300, max: 300, step: 1, isInt: true },
    { key: 'offsetY', group: '位置调整', label: '气泡垂直位置', min: -300, max: 300, step: 1, isInt: true },

    { key: 'tailAngle', group: '尾巴轴线', label: '尾巴角度(度)', min: -80, max: 80, step: 1, isInt: true },
    { key: 'tailSize', group: '尾巴轴线', label: '尾巴总缩放', min: 0.4, max: 2.2, step: 0.02 },
    { key: 'tailType', group: '尾巴轴线', label: '尾巴类型', min: 0, max: 2, step: 1, isInt: true, enum: ['cloud', 'point', 'none'] },
    { key: 'tailSide', group: '尾巴轴线', label: '尾巴方向', min: 0, max: 3, step: 1, isInt: true, enum: ['bottom', 'top', 'left', 'right'] },

    { key: 'cloudWidth', group: '样式调整', label: '云朵横向宽度', min: 0.7, max: 1.4, step: 0.01 },
    { key: 'cloudHeight', group: '样式调整', label: '云朵纵向高度', min: 0.6, max: 1.2, step: 0.01 },
    { key: 'bumpHeight', group: '样式调整', label: '云朵凸起幅度', min: 0.15, max: 0.4, step: 0.01 },
    { key: 'bumpCount', group: '样式调整', label: '云朵凸起瓣数', min: 5, max: 12, step: 1, isInt: true },
    { key: 'lineWidth', group: '样式调整', label: '描边粗细', min: 0, max: 8, step: 0.5 },
    { key: 'fillStyle', group: '样式调整', label: '填充色', type: 'color' },
    { key: 'strokeStyle', group: '样式调整', label: '描边色', type: 'color' },
    { key: 'showDots', group: '样式调整', label: '显示思考圆点', type: 'checkbox', auto: inst => inst.tailType === 'cloud' },
    { key: 'showTail', group: '样式调整', label: '显示尾巴', type: 'checkbox' }
  ],

  draw(inst, ctx, x, y, size, options) {
    options = options || {};
    const st = inst;

    const fillStyle = options.fillStyle || st.fillStyle;
    const strokeStyle = options.strokeStyle || st.strokeStyle;
    const lineWidth = options.lineWidth !== undefined ? options.lineWidth : st.lineWidth;
    const cloudWidth = options.cloudWidth || st.cloudWidth;
    const cloudHeight = options.cloudHeight || st.cloudHeight;
    const bumpHeight = options.bumpHeight || st.bumpHeight;
    const bumpCount = Math.round(options.bumpCount || st.bumpCount);
    const tailType = options.tailType || st.tailType;
    const tailSide = options.tailSide || st.tailSide;
    const tailSize = options.tailSize !== undefined ? options.tailSize : st.tailSize;
    const tailAngle = options.tailAngle !== undefined ? options.tailAngle : st.tailAngle;
    const showTail = options.showTail !== undefined ? options.showTail : st.showTail;

    let showDots;
    if (options.showDots !== undefined) {
      showDots = options.showDots;
    } else if (st.showDots !== null && st.showDots !== undefined) {
      showDots = st.showDots;
    } else {
      showDots = tailType === 'cloud';
    }

    // 气泡主体位置（拖拽偏移量）
    const bubbleX = x + st.offsetX;
    const bubbleY = y + st.offsetY;

    ctx.save();
    ctx.translate(bubbleX, bubbleY);
    ctx.fillStyle = fillStyle;
    ctx.strokeStyle = strokeStyle;
    ctx.lineWidth = lineWidth;
    ctx.lineJoin = 'round';

    const baseRx = size * 0.6 * cloudWidth;
    const baseRy = size * 0.4 * cloudHeight;
    const bumpH = size * bumpHeight;

    // ---------- 绘制气泡主体 ----------
    ctx.beginPath();
    for (let i = 0; i < bumpCount; i++) {
      const angleStart = (i / bumpCount) * Math.PI * 2 - Math.PI / 2;
      const angleEnd = ((i + 1) / bumpCount) * Math.PI * 2 - Math.PI / 2;
      const x1 = Math.cos(angleStart) * baseRx;
      const y1 = Math.sin(angleStart) * baseRy;
      const x2 = Math.cos(angleEnd) * baseRx;
      const y2 = Math.sin(angleEnd) * baseRy;
      const midAngle = (angleStart + angleEnd) / 2;

      let flatFactor = 1;
      if (tailSide === 'bottom' && midAngle > Math.PI / 4 && midAngle < Math.PI * 3 / 4) flatFactor = 0.7;
      if (tailSide === 'top' && midAngle > -Math.PI / 4 && midAngle < Math.PI / 4) flatFactor = 0.7;
      if (tailSide === 'left' && midAngle > Math.PI * 2 / 4 && midAngle < Math.PI * 4 / 4) flatFactor = 0.7;
      if (tailSide === 'right' && midAngle > -Math.PI * 4 / 4 && midAngle < -Math.PI * 2 / 4) flatFactor = 0.7;

      const currentBump = bumpH * flatFactor;
      const cpx = Math.cos(midAngle) * (baseRx + currentBump);
      const cpy = Math.sin(midAngle) * (baseRy + currentBump);
      if (i === 0) ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo(cpx, cpy, x2, y2);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    const matrix = ctx.getTransform();

    // 记录气泡主体边界 → 注册「整体拖动」句柄
    const halfW = baseRx + bumpH;
    const halfH = baseRy + bumpH;
    const g1 = matrixTransformPoint(matrix, -halfW, -halfH);
    const g2 = matrixTransformPoint(matrix, halfW, halfH);
    BuiltinRegistry.pushHandle({
      key: 'bubble',
      label: '气泡主体',
      bounds: { left: g1.x, right: g2.x, top: g1.y, bottom: g2.y },
      onDown(pos) {
        return { offsetX: st.offsetX, offsetY: st.offsetY, mx: pos.x, my: pos.y };
      },
      onMove(pos, d) {
        st.offsetX = d.offsetX + (pos.x - d.mx);
        st.offsetY = d.offsetY + (pos.y - d.my);
      }
    });

    // ---------- 绘制尾巴（比例制轴线驱动） ----------
    let tailDrawn = false;
    let tailBounds = null;
    let tailAxisStart = null;

    if (showTail && tailType !== 'none') {
      const tailBase = size * tailSize;
      const tailR1 = tailBase * 0.18;
      const tailR2 = tailBase * 0.12;
      const tailP1Dist = tailBase * 0.35;
      const tailP2Dist = tailBase * 0.8;

      let tailStartX = 0, tailStartY = 0;
      let baseDirX = 0, baseDirY = 1;

      if (tailSide === 'bottom') {
        tailStartY = baseRy; baseDirX = 0; baseDirY = 1;
      } else if (tailSide === 'top') {
        tailStartY = -baseRy; baseDirX = 0; baseDirY = -1;
      } else if (tailSide === 'left') {
        tailStartX = -baseRx; baseDirX = -1; baseDirY = 0;
      } else if (tailSide === 'right') {
        tailStartX = baseRx; baseDirX = 1; baseDirY = 0;
      }

      const angleRad = (tailAngle * Math.PI) / 180;
      const cos = Math.cos(angleRad);
      const sin = Math.sin(angleRad);
      const dirX = baseDirX * cos - baseDirY * sin;
      const dirY = baseDirX * sin + baseDirY * cos;

      let p1x = tailStartX + dirX * tailP1Dist;
      let p1y = tailStartY + dirY * tailP1Dist;
      let p2x = tailStartX + dirX * tailP2Dist;
      let p2y = tailStartY + dirY * tailP2Dist;

      // 强制两个圆不相交
      const minCenterDist = tailR1 + tailR2 + 3;
      const dx = p2x - p1x;
      const dy = p2y - p1y;
      const dist = Math.hypot(dx, dy);
      if (dist < minCenterDist && dist > 0.001) {
        const scale = minCenterDist / dist;
        p2x = p1x + dx * scale;
        p2y = p1y + dy * scale;
      }

      if (tailType === 'cloud') {
        ctx.beginPath();
        ctx.arc(p1x, p1y, tailR1, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(p2x, p2y, tailR2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        const tMinX = Math.min(p1x - tailR1, p2x - tailR2);
        const tMaxX = Math.max(p1x + tailR1, p2x + tailR2);
        const tMinY = Math.min(p1y - tailR1, p2y - tailR2);
        const tMaxY = Math.max(p1y + tailR1, p2y + tailR2);
        const tp1 = matrixTransformPoint(matrix, tMinX, tMinY);
        const tp2 = matrixTransformPoint(matrix, tMaxX, tMaxY);
        tailBounds = { left: tp1.x, right: tp2.x, top: tp1.y, bottom: tp2.y };
        tailAxisStart = matrixTransformPoint(matrix, tailStartX, tailStartY);
        tailDrawn = true;

      } else if (tailType === 'point') {
        const tipLen = tailBase * 0.55;
        const tipX = tailStartX + dirX * tipLen;
        const tipY = tailStartY + dirY * tipLen;
        const w = tailBase * 0.22;
        const perpX = -dirY * w;
        const perpY = dirX * w;
        const leftX = tipX + perpX, leftY = tipY + perpY;
        const rightX = tipX - perpX, rightY = tipY - perpY;

        ctx.beginPath();
        ctx.moveTo(leftX, leftY);
        ctx.lineTo(tipX, tipY);
        ctx.lineTo(rightX, rightY);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        const tMinX = Math.min(leftX, tipX, rightX);
        const tMaxX = Math.max(leftX, tipX, rightX);
        const tMinY = Math.min(leftY, tipY, rightY);
        const tMaxY = Math.max(leftY, tipY, rightY);
        const tp1 = matrixTransformPoint(matrix, tMinX, tMinY);
        const tp2 = matrixTransformPoint(matrix, tMaxX, tMaxY);
        tailBounds = { left: tp1.x, right: tp2.x, top: tp1.y, bottom: tp2.y };
        tailAxisStart = matrixTransformPoint(matrix, tailStartX, tailStartY);
        tailDrawn = true;
      }
    }

    // 注册「尾巴拖拽」句柄：拖动同时改变 tailAngle 与 tailSize
    if (tailDrawn) {
      BuiltinRegistry.pushHandle({
        key: 'tail',
        label: '气泡尾巴',
        bounds: tailBounds,
        onDown(pos) {
          return {
            startX: tailAxisStart.x,
            startY: tailAxisStart.y,
            tailSize: st.tailSize,
            baseLength: Math.hypot(pos.x - tailAxisStart.x, pos.y - tailAxisStart.y) || 1
          };
        },
        onMove(pos, d) {
          const mdx = pos.x - d.startX;
          const mdy = pos.y - d.startY;

          // 角度：相对 tailSide 基准方向的偏移，归一化到 -180~180 后限制在 ±80
          const baseAngle = { bottom: Math.PI / 2, top: -Math.PI / 2, left: Math.PI, right: 0 }[tailSide];
          let offsetDeg = (Math.atan2(mdy, mdx) - baseAngle) * 180 / Math.PI;
          offsetDeg = ((offsetDeg + 180) % 360 + 360) % 360 - 180;
          st.tailAngle = Math.round(Math.max(-80, Math.min(80, offsetDeg)));

          // 长度：拖动距离 / 按下时距离 = 缩放倍率
          const ratio = Math.hypot(mdx, mdy) / d.baseLength;
          st.tailSize = Math.max(0.4, Math.min(2.2, +(d.tailSize * ratio).toFixed(2)));
        }
      });
    }

    // ---------- 内部思考圆点 ----------
    if (showDots) {
      const dotGap = size * 0.23;
      const dotRadius = size * 0.09;
      ctx.fillStyle = strokeStyle;
      ctx.beginPath();
      ctx.arc(-dotGap, 0, dotRadius, 0, Math.PI * 2);
      ctx.arc(0, 0, dotRadius, 0, Math.PI * 2);
      ctx.arc(dotGap, 0, dotRadius, 0, Math.PI * 2);
      ctx.fill();
    }

    // ---------- 气泡内容（文字、图标等） ----------
    // 回调在当前坐标系内执行：原点 = 气泡中心，且已包含拖拽偏移，
    // 因此写进回调的内容会跟气泡一起移动、一起缩放
    if (typeof options.content === 'function') {
      options.content(ctx, size);
    }

    ctx.restore();
  }
});

// =====================================================================
//  注册项三：drawStarburst（爆炸星形）
//  仅新增此段注册代码，工作台的注入 / 参数面板 / 拖拽自动获得能力
// =====================================================================

BuiltinRegistry.register({
  name: 'drawStarburst',
  kind: 'shape',
  label: '爆炸星形',

  createState() { return Object.assign({}, this.defaults); },
  defaults: {
    starPoints: 8,
    starDepth: 0.45,      // 内圈半径 / 外圈半径
    rotation: 0,
    lineWidth: 3,
    fillStyle: '#ffd54a',
    strokeStyle: '#333333',
    offsetX: 0,
    offsetY: 0
  },

  params: [
    { key: 'offsetX', group: '位置调整', label: '星形水平位置', min: -300, max: 300, step: 1, isInt: true },
    { key: 'offsetY', group: '位置调整', label: '星形垂直位置', min: -300, max: 300, step: 1, isInt: true },

    { key: 'starPoints', group: '星形造型', label: '星形角数', min: 3, max: 20, step: 1, isInt: true },
    { key: 'starDepth', group: '星形造型', label: '内圈半径比例', min: 0.15, max: 0.85, step: 0.01 },
    { key: 'rotation', group: '星形造型', label: '旋转角度(度)', min: -180, max: 180, step: 1, isInt: true },

    { key: 'lineWidth', group: '样式调整', label: '描边粗细', min: 0, max: 10, step: 0.5 },
    { key: 'fillStyle', group: '样式调整', label: '填充色', type: 'color' },
    { key: 'strokeStyle', group: '样式调整', label: '描边色', type: 'color' }
  ],

  draw(inst, ctx, x, y, size, options) {
    options = options || {};
    const st = inst;
    const points = Math.max(3, Math.round(options.starPoints || st.starPoints));
    const depth = options.starDepth || st.starDepth;
    const rotation = options.rotation !== undefined ? options.rotation : st.rotation;
    const lineWidth = options.lineWidth !== undefined ? options.lineWidth : st.lineWidth;
    const fillStyle = options.fillStyle || st.fillStyle;
    const strokeStyle = options.strokeStyle || st.strokeStyle;

    const outerR = size * 0.5;
    const innerR = outerR * depth;

    ctx.save();
    ctx.translate(x + st.offsetX, y + st.offsetY);
    ctx.rotate(rotation * Math.PI / 180);
    ctx.fillStyle = fillStyle;
    ctx.strokeStyle = strokeStyle;
    ctx.lineWidth = lineWidth;
    ctx.lineJoin = 'round';

    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const r = (i % 2 === 0) ? outerR : innerR;
      const a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
      const px = Math.cos(a) * r;
      const py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    if (lineWidth > 0) ctx.stroke();

    // 记录旋转无关的外接圆边界 → 注册「整体拖动」句柄
    const matrix = ctx.getTransform();
    const center = matrixTransformPoint(matrix, 0, 0);
    const scaleX = Math.hypot(matrix.a, matrix.b);
    const scaleY = Math.hypot(matrix.c, matrix.d);
    const r = outerR * Math.max(scaleX, scaleY) + lineWidth;
    BuiltinRegistry.pushHandle({
      key: 'star',
      label: '爆炸星形',
      bounds: { left: center.x - r, right: center.x + r, top: center.y - r, bottom: center.y + r },
      onDown(pos) {
        return { offsetX: st.offsetX, offsetY: st.offsetY, mx: pos.x, my: pos.y };
      },
      onMove(pos, d) {
        st.offsetX = d.offsetX + (pos.x - d.mx);
        st.offsetY = d.offsetY + (pos.y - d.my);
      }
    });

    // ---------- 星形内容（文字、图标等） ----------
    // 同 drawBubble：回调内原点 = 星形中心，已含拖拽偏移与旋转
    if (typeof options.content === 'function') {
      options.content(ctx, size);
    }

    ctx.restore();
  }
});

// =====================================================================
//  注册项三：drawGroup（通用可拖动编组）
//  AI 把任意原生 canvas 绘制代码包进 content 回调，即可获得拖拽能力：
//  内容随编组一起平移，位移由工作台管理并经 @adjust 回写进代码。
// =====================================================================

BuiltinRegistry.register({
  name: 'drawGroup',
  kind: 'shape',
  label: '可拖动编组',

  createState() { return Object.assign({}, this.defaults); },
  defaults: {
    offsetX: 0,
    offsetY: 0,
    width: 120,
    height: 120
  },

  params: [
    { key: 'offsetX', group: '位置调整', label: '编组水平位置', min: -400, max: 400, step: 1, isInt: true },
    { key: 'offsetY', group: '位置调整', label: '编组垂直位置', min: -400, max: 400, step: 1, isInt: true }
  ],

  // 签名：drawGroup(ctx, x, y, options)
  // options.width / options.height：命中区域尺寸，未传时用默认 120×120
  // options.content：内容回调，签名 content(ctx, box)，box = { width, height }
  draw(inst, ctx, x, y, options) {
    options = options || {};
    const st = inst;

    const w = options.width !== undefined ? options.width : st.width;
    const h = options.height !== undefined ? options.height : st.height;

    ctx.save();
    ctx.translate(x + st.offsetX, y + st.offsetY);

    // 内容回调：原点 = 编组中心，已包含拖拽偏移
    if (typeof options.content === 'function') {
      options.content(ctx, { width: w, height: h });
    }

    // 记录编组边界 → 注册「整体拖动」句柄（沿用与 drawBubble 相同的偏移机制）
    const matrix = ctx.getTransform();
    const g1 = matrixTransformPoint(matrix, -w / 2, -h / 2);
    const g2 = matrixTransformPoint(matrix, w / 2, h / 2);
    BuiltinRegistry.pushHandle({
      key: 'group',
      label: '可拖动编组',
      bounds: { left: g1.x, right: g2.x, top: g1.y, bottom: g2.y },
      onDown(pos) {
        return { offsetX: st.offsetX, offsetY: st.offsetY, mx: pos.x, my: pos.y };
      },
      onMove(pos, d) {
        st.offsetX = d.offsetX + (pos.x - d.mx);
        st.offsetY = d.offsetY + (pos.y - d.my);
      }
    });

    ctx.restore();
  }
});

// =====================================================================
//  参数解析器（AI 代码协议层）
// =====================================================================

function parseParams(code) {
  const regex = /@param\s*\{\s*(\w+)\s*\}\s+(\w+)\s+([^|]+?)\s*\|\s*range\s*:\s*([\d.]+)\s*~\s*([\d.]+)\s*\|\s*default\s*:\s*([\d.]+)/g;
  const result = [];
  let match;
  while ((match = regex.exec(code)) !== null) {
    result.push({
      type: match[1],
      name: match[2],
      label: match[3].trim(),
      min: parseFloat(match[4]),
      max: parseFloat(match[5]),
      value: parseFloat(match[6]),
      warning: null
    });
  }
  const constraintRegex = /@constraint\s+(\w+)\s*(>=|<=|>|<)\s*(\w+)/g;
  constraints = [];
  while ((match = constraintRegex.exec(code)) !== null) {
    constraints.push({ left: match[1], op: match[2], right: match[3] });
  }
  const drawFrameMatch = code.match(/function drawFrame\(t\)\s*\{([\s\S]*)\}/);
  if (drawFrameMatch) {
    const body = drawFrameMatch[1];
    result.forEach(p => {
      const redefRegex = new RegExp(`(?:const|let|var)\\s+${p.name}\\s*=`, 'm');
      if (redefRegex.test(body)) {
        p.warning = `警告：函数内部重定义了 ${p.name}，调参将无效`;
      }
    });
  }
  applyAllConstraints(result);
  return result;
}

// ============= 约束校验 =============
function applyAllConstraints(paramList) {
  let changed = true;
  while (changed) {
    changed = false;
    constraints.forEach(c => {
      const leftParam = paramList.find(p => p.name === c.left);
      const rightParam = paramList.find(p => p.name === c.right);
      if (!leftParam || !rightParam) return;
      if ((c.op === '>=' || c.op === '>') && leftParam.value < rightParam.value) {
        leftParam.value = rightParam.value;
        changed = true;
      }
      if ((c.op === '<=' || c.op === '<') && leftParam.value > rightParam.value) {
        leftParam.value = rightParam.value;
        changed = true;
      }
    });
  }
}

// ============= 调整回写（@adjust 协议） =============
// 用户在画布上拖拽 / 改补充参数面板，只改到了内置图形的运行时状态，
// 代码本身毫无变化 —— 此时把代码复制出去，调整就丢了。
// 所以工作台把调整写成 @adjust 注释行，插入到代码开头的「参数区末尾」
// （最后一行 @param / @constraint 之后），解析时再读回来：
//   // @adjust drawBubble[0] offsetX=12, offsetY=-8, tailAngle=-24
// 这样「代码 = 画面」，复制 / 粘贴 / 分享都不会丢调整；
// 注意这些行只记录数值，不含任何逻辑，代码结构与调用关系完全不变。

const ADJUST_LINE = /^\s*\/\/\s*@adjust\s/i;

function parseAdjusts(code) {
  const regex = /@adjust\s+(\w+)\s*\[\s*(\d+)\s*\]\s+([^\n\r]+)/g;
  const result = [];
  let match;
  while ((match = regex.exec(code)) !== null) {
    const patch = {};
    match[3].split(',').forEach(pair => {
      const eq = pair.indexOf('=');
      if (eq === -1) return;
      const key = pair.slice(0, eq).trim();
      const raw = pair.slice(eq + 1).trim();
      if (!key || raw === '') return;
      if (raw === 'true') patch[key] = true;
      else if (raw === 'false') patch[key] = false;
      else if (!isNaN(Number(raw))) patch[key] = Number(raw);
      else patch[key] = raw;
    });
    result.push({ name: match[1], index: parseInt(match[2], 10), patch });
  }
  return result;
}

// 收集某实例相对默认值发生变化的调整项；AI 已声明的参数由代码自己控制，不回写
function collectAdjust(item, st, declaredNames) {
  const parts = [];
  item.params.forEach(p => {
    if (declaredNames.has(p.key)) return;
    const v = st[p.key];
    if (v === null || v === undefined) return;
    if (v === item.defaults[p.key]) return;
    parts.push(`${p.key}=${typeof v === 'string' ? v : String(v)}`);
  });
  return parts;
}

// 把 @adjust 块插到「参数区末尾」—— 最后一行 @param / @constraint 之后；
// 代码里没有任何参数行时插到最前面。放顶部是为了让用户一眼看见回写结果。
function insertAdjustBlock(src, block) {
  const lines = src.split(/\r?\n/);
  let insertAt = 0;
  for (let i = 0; i < lines.length; i++) {
    if (/^\s*\/\/\s*@(param|constraint)\b/i.test(lines[i])) insertAt = i + 1;
  }
  return lines.slice(0, insertAt).concat(block, lines.slice(insertAt)).join('\n');
}

// 收集当前所有需要回写的调整行（纯数值，不含逻辑）
function buildAdjustBlock() {
  const declaredNames = new Set(params.map(p => p.name));
  const lines = [];
  BuiltinRegistry.shapes().forEach(item => {
    item.instances.forEach((st, idx) => {
      const parts = collectAdjust(item, st, declaredNames);
      if (parts.length) lines.push(`// @adjust ${item.name}[${idx}] ${parts.join(', ')}`);
    });
  });
  return lines;
}

// 剥离上一轮工作台写入的 @adjust 行，得到原始的「AI 逻辑代码」
function stripAdjusts(src) {
  return src
    .split(/\r?\n/)
    .filter(line => !ADJUST_LINE.test(line))
    .join('\n')
    .replace(/\s+$/, '');
}

// 把当前调整状态写回代码框（@adjust 块插到参数区末尾，覆盖上一次生成的块）
function syncCodeFromState() {
  const block = buildAdjustBlock();
  const stripped = stripAdjusts(codeInput.value);
  const next = block.length ? insertAdjustBlock(stripped, block) + '\n' : stripped + '\n';
  if (next !== codeInput.value) codeInput.value = next;
}

// 生成「导出用」的代码：与当前代码逐字相同，只在参数区多了若干条 @adjust
// 数值行；函数结构、调用关系、表达式全部不变 —— 拖拽只改数值，不改逻辑。
function buildExportCode() {
  const block = buildAdjustBlock();
  const stripped = stripAdjusts(codeInput.value);
  const body = block.length ? insertAdjustBlock(stripped, block) : stripped;
  return body + '\n';
}

// =====================================================================
//  渲染函数构建：内置函数从注册表动态注入
// =====================================================================

function buildDrawFrame(code, params) {
  let processedCode = code;
  params.forEach(p => {
    const redefRegex = new RegExp(`(?:const|let|var)\\s+${p.name}\\s*=\\s*[^;]+;?`, 'g');
    processedCode = processedCode.replace(redefRegex, '');
  });
  const paramNames = params.map(p => p.name);
  const paramValues = params.map(p => p.value);
  const fn = new Function(
    'ctx', 'canvas', 't',
    ...BuiltinRegistry.names(),
    ...paramNames,
    processedCode + '\n return drawFrame;'
  );
  try {
    return fn(ctx, canvas, 0, ...BuiltinRegistry.fns(), ...paramValues);
  } catch (e) {
    statusEl.textContent = '代码执行错误: ' + e.message;
    statusEl.className = 'status error';
    return null;
  }
}

// ---- 内置参数读写（面板统一绑定到每个注册项的实例 0） ----

function readCheckbox(p, inst) {
  const v = inst[p.key];
  if (v !== null && v !== undefined) return v;
  return p.auto ? p.auto(inst) : false;
}

function paramSliderValue(p, inst) {
  if (p.enum) {
    const i = p.enum.indexOf(inst[p.key]);
    return i < 0 ? 0 : i;
  }
  return inst[p.key];
}

function paramDisplay(p, inst) {
  const v = inst[p.key];
  if (p.type === 'checkbox') return readCheckbox(p, inst) ? '开' : '关';
  if (p.type === 'color') return String(v);
  if (p.enum) return String(v);
  if (p.isInt) return String(Math.round(v));
  return v.toFixed(2);
}

function builtinDomId(item, p, prefix) {
  return prefix + item.name + '-' + p.key;
}

function renderBuiltinParam(item, p, host) {
  const inst = item.instances[0];
  const el = document.createElement('div');
  el.className = 'bubble-param-item';

  const label = document.createElement('div');
  label.className = 'bubble-param-label';
  const labelId = builtinDomId(item, p, 'bil-');

  if (p.type === 'checkbox') {
    const on = !!readCheckbox(p, inst);
    label.innerHTML = `<span>${p.label}</span><span class="value" id="${labelId}">${on ? '开' : '关'}</span>`;
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.className = 'bubble-param-checkbox';
    checkbox.checked = on;
    checkbox.addEventListener('change', () => {
      inst[p.key] = checkbox.checked;
      document.getElementById(labelId).textContent = checkbox.checked ? '开' : '关';
      render();
    });
    el.appendChild(label);
    el.appendChild(checkbox);

  } else if (p.type === 'color') {
    label.innerHTML = `<span>${p.label}</span><span class="value" id="${labelId}">${inst[p.key]}</span>`;
    const input = document.createElement('input');
    input.type = 'color';
    input.className = 'bubble-param-color';
    input.id = builtinDomId(item, p, 'bi-');
    input.value = inst[p.key];
    input.addEventListener('input', () => {
      inst[p.key] = input.value;
      document.getElementById(labelId).textContent = input.value;
      render();
    });
    el.appendChild(label);
    el.appendChild(input);

  } else {
    label.innerHTML = `<span>${p.label}</span><span class="value" id="${labelId}">${paramDisplay(p, inst)}</span>`;
    const slider = document.createElement('input');
    slider.type = 'range';
    slider.className = 'bubble-param-slider';
    slider.id = builtinDomId(item, p, 'bi-');
    slider.min = p.min;
    slider.max = p.max;
    slider.step = p.step || (p.max - p.min) / 100;
    slider.value = paramSliderValue(p, inst);
    slider.addEventListener('input', () => {
      const raw = parseFloat(slider.value);
      if (p.enum) inst[p.key] = p.enum[raw];
      else if (p.isInt) inst[p.key] = Math.round(raw);
      else inst[p.key] = raw;
      document.getElementById(labelId).textContent = paramDisplay(p, inst);
      render();
    });
    el.appendChild(label);
    el.appendChild(slider);
  }

  host.appendChild(el);
}

// 画布拖拽后反向同步内置面板滑块
function syncBuiltinSliders() {
  BuiltinRegistry.shapes().forEach(item => {
    const inst = item.instances[0];
    item.params.forEach(p => {
      const slider = document.getElementById(builtinDomId(item, p, 'bi-'));
      const label = document.getElementById(builtinDomId(item, p, 'bil-'));
      if (p.type === 'checkbox') {
        if (slider) slider.checked = !!readCheckbox(p, inst);
      } else if (p.type !== 'color' && slider) {
        slider.value = paramSliderValue(p, inst);
      }
      if (label) label.textContent = paramDisplay(p, inst);
    });
  });
}

// =====================================================================

function renderAiParamPanel() {
  params.forEach((p, idx) => {
    const item = document.createElement('div');
    item.className = 'param-item';
    const label = document.createElement('div');
    label.className = 'param-label';
    label.innerHTML = `<span>${p.label}</span><span class="value">${p.value.toFixed(2)}</span>`;
    const slider = document.createElement('input');
    slider.type = 'range';
    slider.className = 'param-slider';
    slider.min = p.min;
    slider.max = p.max;
    slider.step = (p.max - p.min) / 100;
    slider.value = p.value;
    slider.addEventListener('input', () => {
      params[idx].value = parseFloat(slider.value);
      label.querySelector('.value').textContent = params[idx].value.toFixed(2);
      applyAllConstraints(params);
      syncAllParamUI();
      drawFrame = buildDrawFrame(codeInput.value, params);
      render();
    });
    item.appendChild(label);
    if (p.warning) {
      const warn = document.createElement('div');
      warn.className = 'warning';
      warn.textContent = p.warning;
      item.appendChild(warn);
    }
    item.appendChild(slider);
    paramPanel.appendChild(item);
  });
}

// 按注册表自动生成内置函数分节
function renderBuiltinPanel() {
  const declaredNames = params.map(p => p.name);
  const code = codeInput.value;

  BuiltinRegistry.shapes().forEach(item => {
    // 只给「代码里真正调用过」的内置图形生成补充参数分节，避免未使用的图形空占面板
    if (!new RegExp('\\b' + item.name + '\\s*\\(').test(code)) return;
    const visible = item.params.filter(p => !declaredNames.includes(p.key));
    if (visible.length === 0) return;

    const panel = document.createElement('div');
    panel.className = 'supplement-panel';

    const header = document.createElement('div');
    header.className = 'supplement-header';
    header.innerHTML =
      `<span>${item.label || item.name} 补充参数 <span class="supplement-tip">（代码未指定时生效）</span></span>` +
      `<span class="supplement-arrow ${item.collapsed ? 'collapsed' : ''}">▼</span>`;

    const content = document.createElement('div');
    content.className = `supplement-content ${item.collapsed ? 'collapsed' : ''}`;

    header.addEventListener('click', () => {
      item.collapsed = !item.collapsed;
      content.classList.toggle('collapsed');
      header.querySelector('.supplement-arrow').classList.toggle('collapsed');
    });

    let currentGroup = '';
    visible.forEach(p => {
      if (p.group && p.group !== currentGroup) {
        currentGroup = p.group;
        const groupTitle = document.createElement('div');
        groupTitle.className = 'panel-group-title';
        groupTitle.textContent = currentGroup;
        content.appendChild(groupTitle);
      }
      renderBuiltinParam(item, p, content);
    });

    panel.appendChild(header);
    panel.appendChild(content);
    paramPanel.appendChild(panel);
  });
}

function renderParamPanel() {
  paramPanel.innerHTML = '<h3>参数面板</h3>';
  renderAiParamPanel();
  renderBuiltinPanel();
}

function renderTimeMarkers() {
  timeMarkerLayer.innerHTML = '';
  const timelineMax = parseFloat(timeSlider.max);
  params.forEach((p, idx) => {
    if (p.type !== 'time') return;
    const marker = document.createElement('div');
    marker.className = 'time-marker';
    const percent = p.value / timelineMax;
    marker.style.left = (percent * 100) + '%';
    marker.dataset.index = idx;
    const label = document.createElement('div');
    label.className = 'time-marker-label';
    label.textContent = p.label;
    marker.appendChild(label);
    marker.addEventListener('mousedown', (e) => {
      e.preventDefault();
      draggingIndex = idx;
      dragStartX = e.clientX;
      dragStartValue = p.value;
      document.addEventListener('mousemove', onDragMarker);
      document.addEventListener('mouseup', endDragMarker);
    });
    timeMarkerLayer.appendChild(marker);
  });
}

function onDragMarker(e) {
  if (draggingIndex === -1) return;
  const layerRect = timeMarkerLayer.getBoundingClientRect();
  const dx = e.clientX - dragStartX;
  const timelineMax = parseFloat(timeSlider.max);
  const valueDelta = (dx / layerRect.width) * timelineMax;
  let newValue = dragStartValue + valueDelta;
  newValue = Math.max(params[draggingIndex].min, Math.min(params[draggingIndex].max, newValue));
  params[draggingIndex].value = newValue;
  applyAllConstraints(params);
  syncAllParamUI();
  drawFrame = buildDrawFrame(codeInput.value, params);
  render();
}

function endDragMarker() {
  draggingIndex = -1;
  document.removeEventListener('mousemove', onDragMarker);
  document.removeEventListener('mouseup', endDragMarker);
}

// =====================================================================
//  画布拖拽：通用 hit-test 循环（由注册表句柄驱动，无硬编码对象字典）
// =====================================================================

function getCanvasMousePos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

canvas.addEventListener('mousedown', (e) => {
  const pos = getCanvasMousePos(e);
  const handle = BuiltinRegistry.pickHandle(pos.x, pos.y);
  if (!handle) return;

  activeHandle = handle;
  activeDragCtx = handle.onDown ? handle.onDown(pos) : null;
  wasPlayingBeforeDrag = playing;
  if (playing) {
    playing = false;
    playBtn.textContent = '播放';
  }
  canvas.classList.add('obj-dragging');
  canvas.classList.remove('obj-hover');
  e.preventDefault();
});

canvas.addEventListener('mousemove', (e) => {
  const pos = getCanvasMousePos(e);

  if (activeHandle) {
    if (activeHandle.onMove) activeHandle.onMove(pos, activeDragCtx);
    syncBuiltinSliders();
    render();
    return;
  }

  canvas.classList.toggle('obj-hover', !!BuiltinRegistry.pickHandle(pos.x, pos.y));
});

canvas.addEventListener('mouseup', () => {
  if (!activeHandle) return;
  activeHandle = null;
  activeDragCtx = null;
  canvas.classList.remove('obj-dragging');
  syncCodeFromState(); // 拖动结束：把调整回写进代码
  if (wasPlayingBeforeDrag) {
    playing = true;
    playBtn.textContent = '暂停';
    lastTime = 0;
  }
});

canvas.addEventListener('mouseleave', () => {
  activeHandle = null;
  activeDragCtx = null;
  canvas.classList.remove('obj-dragging', 'obj-hover');
});

// =====================================================================
//  渲染循环
// =====================================================================

function render() {
  if (!drawFrame) return;
  BuiltinRegistry.beginFrame();
  try {
    drawFrame(t);
    timeDisplay.textContent = t.toFixed(2) + 's';
  } catch (e) {
    statusEl.textContent = '渲染错误: ' + e.message;
    statusEl.className = 'status error';
  }
}

function loop(now) {
  if (!lastTime) lastTime = now;
  const delta = (now - lastTime) / 1000;
  lastTime = now;
  if (playing) {
    t += delta;
    if (t > parseFloat(timeSlider.max)) t = 0;
    timeSlider.value = t;
    render();
  }
  requestAnimationFrame(loop);
}

// =====================================================================
//  事件绑定
// =====================================================================

parseBtn.addEventListener('click', () => {
  const code = codeInput.value;
  params = parseParams(code);
  // 先把内置图形状态复位为默认值，再应用代码里的 @adjust 行，保证「代码 = 画面」
  BuiltinRegistry.resetStates();
  parseAdjusts(code).forEach(a => BuiltinRegistry.setState(a.name, a.index, a.patch));
  // 时间轴上限跟随时间参数的 range 自适应（须在 renderTimeMarkers 之前调用）
  updateTimelineMax();
  if (params.length === 0) {
    statusEl.textContent = '未识别到参数，请检查 @param 注释格式';
    statusEl.className = 'status error';
    paramPanel.innerHTML = '<h3>参数面板</h3>';
    renderParamPanel();
    renderTimeMarkers();
    updateContentDuration();
    return;
  }
  drawFrame = buildDrawFrame(code, params);
  if (!drawFrame) {
    renderParamPanel();
    renderTimeMarkers();
    updateContentDuration();
    return;
  }
  renderParamPanel();
  renderTimeMarkers();
  updateContentDuration();
  render();
  const hasWarning = params.some(p => p.warning);
  statusEl.textContent = `成功解析 ${params.length} 个参数${hasWarning ? '（含警告）' : ''}`;
  statusEl.className = 'status';
});

// 补充参数面板里的任何调整（change 事件冒泡）→ 回写到代码
paramPanel.addEventListener('change', () => syncCodeFromState());

playBtn.addEventListener('click', () => {
  playing = !playing;
  playBtn.textContent = playing ? '暂停' : '播放';
  lastTime = 0;
});

timeSlider.addEventListener('input', () => {
  t = parseFloat(timeSlider.value);
  render();
});

// =====================================================================
//  导出当前代码（只反映数值调整，不改逻辑）
// =====================================================================

const exportModal = document.getElementById('exportModal');
const exportOutput = document.getElementById('exportOutput');
const exportCopyBtn = document.getElementById('exportCopyBtn');
const exportApplyBtn = document.getElementById('exportApplyBtn');
const exportCloseBtn = document.getElementById('exportCloseBtn');

function openExportModal() {
  exportOutput.value = buildExportCode();
  exportModal.classList.add('open');
}

exportBtn.addEventListener('click', openExportModal);
exportCloseBtn.addEventListener('click', () => exportModal.classList.remove('open'));
exportModal.addEventListener('click', (e) => {
  if (e.target === exportModal) exportModal.classList.remove('open');
});

exportCopyBtn.addEventListener('click', () => {
  exportOutput.select();
  exportOutput.setSelectionRange(0, exportOutput.value.length);
  try { document.execCommand('copy'); } catch (err) { /* 忽略 */ }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(exportOutput.value).catch(() => {});
  }
  exportCopyBtn.textContent = '已复制';
  setTimeout(() => { exportCopyBtn.textContent = '复制'; }, 1200);
});

exportApplyBtn.addEventListener('click', () => {
  codeInput.value = exportOutput.value;
  exportModal.classList.remove('open');
  parseBtn.click();
});

// =====================================================================
//  默认示例
// =====================================================================

const demoCode = `// @param {time} popStart 角色弹出开始时间 | range: 0~8 | default: 0
// @param {time} popEnd 角色弹出结束时间 | range: 0~8 | default: 1.2
// @param {time} bubbleDelay 气泡延迟出现时间 | range: 0~8 | default: 1.5
// @param {time} starStart 星星弹出时间 | range: 0~8 | default: 1.9
// @param {number} bubbleSize 气泡大小 | range: 80~220 | default: 140
// @param {number} starSize 星星大小 | range: 60~160 | default: 96
// @param {number} cloudWidth 云朵横向宽度 | range: 0.7~1.4 | default: 1.0
// @param {number} cloudHeight 云朵纵向高度 | range: 0.6~1.2 | default: 1.0
// @param {number} bumpHeight 云朵凸起幅度 | range: 0.15~0.4 | default: 0.25
// @param {number} bumpCount 云朵瓣数 | range: 5~12 | default: 7
// @constraint popEnd >= popStart
// @adjust drawBubble[0] offsetX=-66, offsetY=-36, tailAngle=-42, tailSize=0.79
// @adjust drawStarburst[0] offsetX=-465, offsetY=-130
function drawFrame(t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const charX = canvas.width / 2;
  const charY = canvas.height - 130;
  const charSize = 90;
  const charHalf = charSize / 2;
  const charProg = prog(t, popStart, popEnd);
  const charScale = easeOutBack(charProg);
  // 角色方块原本是用原生 API 直接画的，没有拖拽句柄；包进 drawGroup 后即可整块拖动
  drawGroup(ctx, charX, charY, {
    width: charSize,
    height: charSize + 40,
    content: (c) => {
      c.save();
      c.scale(charScale, charScale);
      c.fillStyle = '#ff8822';
      c.fillRect(-charHalf, -charHalf, charSize, charSize);
      c.strokeStyle = '#333';
      c.lineWidth = 3;
      c.strokeRect(-charHalf, -charHalf, charSize, charSize);
      c.fillStyle = '#fff';
      c.beginPath();
      c.arc(-22, -18, 10, 0, Math.PI * 2);
      c.arc(22, -18, 10, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#222';
      c.beginPath();
      c.arc(-22, -18, 4.5, 0, Math.PI * 2);
      c.arc(22, -18, 4.5, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#ff8822';
      c.fillRect(-28, charHalf - 8, 18, 28);
      c.fillRect(10, charHalf - 8, 18, 28);
      c.strokeRect(-28, charHalf - 8, 18, 28);
      c.strokeRect(10, charHalf - 8, 18, 28);
      c.restore();
    }
  });

  const bubbleT = delay(t, bubbleDelay);
  const bubbleProg = prog(bubbleT, 0, 0.55);
  const bubbleScale = easeOutBack(bubbleProg);
  const bubbleAlpha = easeInOut(bubbleProg);
  const bubbleY = charY - charHalf - bubbleSize * 0.8;
  ctx.save();
  ctx.globalAlpha = bubbleAlpha;
  ctx.translate(charX, bubbleY);
  ctx.scale(bubbleScale, bubbleScale);
  drawBubble(ctx, 0, 0, bubbleSize, {
    cloudWidth: cloudWidth,
    cloudHeight: cloudHeight,
    bumpHeight: bumpHeight,
    bumpCount: bumpCount,
    showDots: false,
    content: (c, size) => {
      c.fillStyle = '#333333';
      c.font = 'bold ' + Math.round(size * 0.16) + 'px sans-serif';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText('你好呀！', 0, 0);
    }
  });
  ctx.restore();

  const starProg = prog(delay(t, starStart), 0, 0.45);
  if (starProg > 0) {
    const starScale = easeOutBack(starProg);
    ctx.save();
    ctx.translate(charX + 150, charY - 170);
    ctx.rotate((1 - starProg) * -0.9);
    ctx.scale(starScale, starScale);
    drawStarburst(ctx, 0, 0, starSize);
    ctx.restore();
  }
}`;

codeInput.value = demoCode;
parseBtn.click();
requestAnimationFrame(loop);
</script>
