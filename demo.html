<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>T-Anim Workbench MVP v0.1</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: #1e1e1e; color: #ddd; height: 100vh; display: flex; flex-direction: column; }

/* 顶部布局 */
.main { flex: 1; display: flex; overflow: hidden; }

/* 左侧面板 */
.sidebar { width: 320px; background: #252526; border-right: 1px solid #333; display: flex; flex-direction: column; }
.sidebar-section { padding: 12px; border-bottom: 1px solid #333; }
.sidebar h3 { font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #ccc; }

#codeInput {
  width: 100%; height: 180px; background: #1e1e1e; color: #d4d4d4; border: 1px solid #3c3c3c;
  padding: 8px; font-family: Consolas, monospace; font-size: 12px; resize: vertical;
}
#parseBtn {
  width: 100%; padding: 6px; margin-top: 8px; background: #0e639c; color: #fff;
  border: none; border-radius: 2px; cursor: pointer; font-size: 12px;
}
#parseBtn:hover { background: #1177bb; }

/* 参数面板 */
#paramPanel { flex: 1; overflow-y: auto; }
.param-item { margin-bottom: 10px; }
.param-label { font-size: 11px; color: #9cdcfe; margin-bottom: 4px; display: flex; justify-content: space-between; }
.param-label .value { color: #ce9178; font-family: Consolas, monospace; }
.param-slider { width: 100%; }

/* 画布区域 */
.canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #1a1a1a; }
#canvas { background: #f3f1ec; box-shadow: 0 0 20px rgba(0,0,0,0.3); }

/* 底部时间轴 */
.timeline {
  height: 60px; background: #252526; border-top: 1px solid #333;
  display: flex; align-items: center; padding: 0 16px; gap: 12px;
}
#playBtn {
  padding: 4px 12px; background: #0e639c; color: #fff; border: none;
  border-radius: 2px; cursor: pointer; font-size: 12px;
}
#timeSlider { flex: 1; }
#timeDisplay { font-family: Consolas, monospace; font-size: 12px; color: #ce9178; min-width: 50px; text-align: right; }

.status { font-size: 11px; color: #6a9955; margin-top: 6px; }
.error { color: #f44747; }
</style>
</head>
<body>

<div class="main">
  <!-- 左侧控制面板 -->
  <div class="sidebar">
    <div class="sidebar-section">
      <h3>动画代码（符合 T-Anim v0.1 规范）</h3>
      <textarea id="codeInput"></textarea>
      <button id="parseBtn">解析参数并加载</button>
      <div id="status" class="status">等待输入代码</div>
    </div>
    <div class="sidebar-section" id="paramPanel">
      <h3>参数面板</h3>
      <div style="font-size:11px;color:#888;">解析代码后自动生成</div>
    </div>
  </div>

  <!-- 画布预览区 -->
  <div class="canvas-wrap">
    <canvas id="canvas" width="800" height="500"></canvas>
  </div>
</div>

<!-- 底部时间轴 -->
<div class="timeline">
  <button id="playBtn">播放</button>
  <input type="range" id="timeSlider" min="0" max="10" step="0.01" value="0">
  <div id="timeDisplay">0.00s</div>
</div>

<script>
// ============= 内置标准函数库 v0.1（与规范完全一致） =============
function prog(t, start, end) {
  if (t < start) return 0;
  if (t > end) return 1;
  return (t - start) / (end - start);
}

function fade(t, start, end, inDur, outDur) {
  if (t < start) return 0;
  if (t > end + outDur) return 0;
  if (t < start + inDur) return (t - start) / inDur;
  if (t > end) return (end + outDur - t) / outDur;
  return 1;
}

function easeParabola(x) {
  return 1 - (2 * x - 1) * (2 * x - 1);
}

// ============= 全局状态 =============
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const codeInput = document.getElementById('codeInput');
const parseBtn = document.getElementById('parseBtn');
const paramPanel = document.getElementById('paramPanel');
const playBtn = document.getElementById('playBtn');
const timeSlider = document.getElementById('timeSlider');
const timeDisplay = document.getElementById('timeDisplay');
const statusEl = document.getElementById('status');

let params = [];       // 参数列表 [{name, type, label, min, max, value}]
let drawFrame = null;  // 当前渲染函数
let t = 0;             // 全局时间
let playing = false;
const FPS = 30;
let lastTime = 0;

// ============= 参数解析器 =============
function parseParams(code) {
  const regex = /@param\s*\{\s*(\w+)\s*\}\s+(\w+)\s+([^|]+?)\s*\|\s*range\s*:\s*([\d.]+)\s*~\s*([\d.]+)\s*\|\s*default\s*:\s*([\d.]+)/g;
  const result = [];
  let match;
  while ((match = regex.exec(code)) !== null) {
    result.push({
      type: match[1],
      name: match[2],
      label: match[3].trim(),
      min: parseFloat(match[4]),
      max: parseFloat(match[5]),
      value: parseFloat(match[6])
    });
  }

  // 检测函数内部是否重定义参数
  const drawFrameMatch = code.match(/function drawFrame\(t\)\s*\{([\s\S]*)\}/);
  if (drawFrameMatch) {
    const body = drawFrameMatch[1];
    result.forEach(p => {
      const redefRegex = new RegExp(`(?:const|let|var)\\s+${p.name}\\s*=`, 'm');
      if (redefRegex.test(body)) {
        p.warning = `警告：函数内部重定义了 ${p.name}，调参将无效`;
      }
    });
  }

  return result;
}


// ============= 构建渲染函数 =============
function buildDrawFrame(code, params) {
  let processedCode = code;

  // 自动修复：移除函数内部对参数变量的声明，避免重复声明报错
  params.forEach(p => {
    const redefRegex = new RegExp(`(?:const|let|var)\\s+${p.name}\\s*=\\s*[^;]+;?`, 'g');
    processedCode = processedCode.replace(redefRegex, '');
  });

  const paramNames = params.map(p => p.name);
  const paramValues = params.map(p => p.value);
  
  const fn = new Function(
    'ctx', 'canvas', 't', 'prog', 'fade', 'easeParabola', ...paramNames,
    processedCode + '\n return drawFrame;'
  );

  try {
    return fn(ctx, canvas, 0, prog, fade, easeParabola, ...paramValues);
  } catch (e) {
    statusEl.textContent = '代码执行错误: ' + e.message;
    statusEl.className = 'status error';
    return null;
  }
}


// ============= 生成参数面板控件 =============
function renderParamPanel() {
  paramPanel.innerHTML = '<h3>参数面板</h3>';
  params.forEach((p, idx) => {
    const item = document.createElement('div');
    item.className = 'param-item';
    
    const label = document.createElement('div');
    label.className = 'param-label';
    label.innerHTML = `<span>${p.label}</span><span class="value">${p.value}</span>`;
    
    const slider = document.createElement('input');
    slider.type = 'range';
    slider.className = 'param-slider';
    slider.min = p.min;
    slider.max = p.max;
    slider.step = (p.max - p.min) / 100;
    slider.value = p.value;
    
    slider.addEventListener('input', () => {
      params[idx].value = parseFloat(slider.value);
      label.querySelector('.value').textContent = params[idx].value.toFixed(2);
      // 重新构建渲染函数（应用新参数值）
      drawFrame = buildDrawFrame(codeInput.value, params);
      render();
    });
    
    item.appendChild(label);

    // ===== 参数重定义警告 =====
    if (p.warning) {
      const warn = document.createElement('div');
      warn.style.fontSize = '10px';
      warn.style.color = '#f44747';
      warn.style.marginTop = '2px';
      warn.textContent = p.warning;
      item.appendChild(warn);
    }
    // ========================

    item.appendChild(slider);
    paramPanel.appendChild(item);
  });
}

// ============= 渲染单帧 =============
function render() {
  if (!drawFrame) return;
  try {
    drawFrame(t);
    timeDisplay.textContent = t.toFixed(2) + 's';
  } catch (e) {
    statusEl.textContent = '渲染错误: ' + e.message;
    statusEl.className = 'status error';
  }
}

// ============= 动画循环 =============
function loop(now) {
  if (!lastTime) lastTime = now;
  const delta = (now - lastTime) / 1000;
  lastTime = now;

  if (playing) {
    t += delta;
    if (t > parseFloat(timeSlider.max)) t = 0;
    timeSlider.value = t;
    render();
  }

  requestAnimationFrame(loop);
}

// ============= 事件绑定 =============
parseBtn.addEventListener('click', () => {
  const code = codeInput.value;
  params = parseParams(code);
  
  if (params.length === 0) {
    statusEl.textContent = '未识别到参数，请检查 @param 注释格式';
    statusEl.className = 'status error';
    return;
  }

  drawFrame = buildDrawFrame(code, params);
  if (!drawFrame) return;

  renderParamPanel();
  render();
  statusEl.textContent = `成功解析 ${params.length} 个参数`;
  statusEl.className = 'status';
});

playBtn.addEventListener('click', () => {
  playing = !playing;
  playBtn.textContent = playing ? '暂停' : '播放';
  lastTime = 0;
});

timeSlider.addEventListener('input', () => {
  t = parseFloat(timeSlider.value);
  render();
});

// ============= 默认加载示例代码 =============
const demoCode = `// @param {number} jumpHeight 弹跳高度 | range: 0~200 | default: 120
// @param {number} jumpStart 起跳时间 | range: 0~5 | default: 1.0
// @param {number} jumpEnd 落地时间 | range: 0~5 | default: 2.2
// @param {number} smileTime 表情切换时间 | range: 0~5 | default: 3.0

function drawFrame(t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const baseY = 350;
  const cx = 400;

  // 计算弹跳位移
  const p = prog(t, jumpStart, jumpEnd);
  const lift = easeParabola(p) * jumpHeight;
  const cy = baseY - lift;

  // 绘制方块身体
  ctx.fillStyle = '#e6703b';
  ctx.fillRect(cx - 100, cy - 60, 200, 100);
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 2;
  ctx.strokeRect(cx - 100, cy - 60, 200, 100);

  // 绘制腿
  ctx.fillRect(cx - 80, cy + 40, 22, 40);
  ctx.fillRect(cx - 20, cy + 40, 22, 40);
  ctx.fillRect(cx + 30, cy + 40, 22, 40);
  ctx.fillRect(cx + 90, cy + 40, 22, 40);

  // 绘制眼睛，t >= smileTime 切换为弯眼
  if (t >= smileTime) {
    ctx.beginPath();
    ctx.arc(cx - 40, cy - 20, 12, Math.PI, 0);
    ctx.arc(cx + 40, cy - 20, 12, Math.PI, 0);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.arc(cx - 40, cy - 25, 10, 0, Math.PI * 2);
    ctx.arc(cx + 40, cy - 25, 10, 0, Math.PI * 2);
    ctx.fill();
  }

  // 绘制地面
  ctx.beginPath();
  ctx.moveTo(100, baseY + 80);
  ctx.lineTo(700, baseY + 80);
  ctx.stroke();
}`;

codeInput.value = demoCode;
// 自动解析默认示例
parseBtn.click();

// 启动渲染循环
requestAnimationFrame(loop);
</script>
</body>
</html>
